<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeu - Lexique de l'ascenseur</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#eef2f5;color:#1f2937;overflow:hidden}
body{display:flex;flex-direction:column}
header{background:#1f4e79;color:#fff;text-align:center;padding:10px 14px;flex:0 0 auto}
header h1{margin:0 0 3px;font-size:clamp(18px,2.2vw,25px)}
header p{margin:0;font-size:clamp(11px,1.2vw,14px)}
#fullscreenBtn{position:absolute;right:12px;top:10px;width:auto;margin:0;padding:8px 12px;background:#fff;color:#1f4e79;border-radius:7px}
.layout{display:flex;gap:12px;width:100%;height:calc(100vh - 72px);padding:12px;min-height:0}
.panel{width:210px;flex:0 0 210px;background:#fff;border-radius:10px;padding:12px;box-shadow:0 2px 10px #0002;overflow:auto}
.panel h2{font-size:16px;margin:0 0 10px}
#words{display:flex;flex-direction:column;gap:7px}
.word{background:#fff;border:2px solid #1f4e79;border-radius:7px;padding:7px 9px;font-size:14px;font-weight:bold;cursor:grab;user-select:none;box-shadow:0 2px 4px #0002;touch-action:none}
.word.placed{position:absolute;z-index:10;white-space:nowrap;background:#fff9c4;border-color:#d99a00}
button{width:100%;margin-top:10px;padding:9px;border:0;border-radius:7px;background:#1f4e79;color:#fff;font-weight:bold;cursor:pointer}
.hint{margin-top:8px;font-size:11px;line-height:1.35;color:#5b6470}
.stage-wrap{flex:1;min-width:0;min-height:0;background:#fff;border-radius:10px;padding:8px;box-shadow:0 2px 10px #0002;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;min-width:0;width:100%;overflow:hidden;border:1px solid #cbd5e1;background:#fff;display:flex;align-items:center;justify-content:center}
#elevator-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.drop-message{text-align:center;margin:4px 0 0;font-size:10px;color:#64748b;flex:0 0 auto}
@media(max-width:700px){
  header{padding-right:105px}
  .layout{flex-direction:column;height:calc(100vh - 64px);padding:7px}
  .panel{width:100%;flex:0 0 auto;max-height:145px;padding:8px}
  #words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
  .panel h2{display:none}
  .hint{display:none}
  button{margin-top:6px}
  .stage-wrap{min-height:0}
}
:fullscreen .layout{height:calc(100vh - 72px)}
</style>

<style>
body.fullscreen-game header{display:none}
body.fullscreen-game .layout{
  width:100vw;height:100vh;padding:0;display:block;position:relative
}
body.fullscreen-game .stage-wrap{
  position:absolute;inset:0;padding:0;border-radius:0;box-shadow:none;background:#111
}
body.fullscreen-game #stage{
  width:100%;height:100%;border:0;background:#111
}
body.fullscreen-game #elevator-image{
  width:100%;height:100%;max-width:none;max-height:none;
  object-fit:contain;
}
body.fullscreen-game .panel{
  position:absolute;z-index:200;left:12px;top:12px;width:220px;
  max-height:calc(100vh - 24px);overflow:auto;
  background:rgba(255,255,255,.94);
}
body.fullscreen-game .drop-message{display:none}
body.fullscreen-game #fullscreenBtn{
  position:fixed;z-index:300;right:12px;top:12px;
}
</style>
</head>
<body>
<header>
<button id="fullscreenBtn" type="button">⛶ Plein écran</button>
<h1>Jeu - Lexique de l'ascenseur</h1>
<p>Faites glisser chaque mot et placez-le où vous voulez sur le dessin.</p>
</header>

<div id="words"></div>

</aside>

<script>
const fullscreenBtn = document.getElementById("fullscreenBtn");
fullscreenBtn.addEventListener("click", async () => {
  try {
    if (!document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {}
});
document.addEventListener("fullscreenchange", () => {
  const fs = !!document.fullscreenElement;
  fullscreenBtn.textContent = fs ? "⛶ Quitter le plein écran" : "⛶ Plein écran";
  document.body.classList.toggle("fullscreen-game", fs);
});
</script>
<script>
const labels=["Cabine", "Contrepoids", "Arcade", "Porte palière", "Porte cabine", "Machinerie", "Treuil", "Fond de fosse", "Guide"];
const words=document.getElementById("words"),stage=document.getElementById("stage");
function makeWord(text,index){
 const el=document.createElement("div"); el.className="word"; el.textContent=text; el.dataset.index=index;
 words.appendChild(el); enableDrag(el);
}
labels.forEach(makeWord);
function enableDrag(el){
 let dragging=false,ox=0,oy=0;
 el.addEventListener("pointerdown",e=>{
  dragging=true; el.setPointerCapture(e.pointerId);
  const sr=stage.getBoundingClientRect();
  if(el.parentElement!==stage){
   const er=el.getBoundingClientRect();
   el.classList.add("placed"); stage.appendChild(el);
   // À l'arrivée sur l'image, le mot apparaît toujours au centre.
   // C'est particulièrement pratique en plein écran : le joueur
   // peut immédiatement venir le chercher avec la souris.
   el.style.left=Math.max(0,(sr.width-er.width)/2)+"px";
   el.style.top=Math.max(0,(sr.height-er.height)/2)+"px";
  }
  // Recalculer la position après le placement au centre.
  // Le décalage souris est calculé sur la position finale : le mot
  // ne saute donc pas vers le bas lorsque la souris arrive dessus.
  const r=el.getBoundingClientRect();
  ox=e.clientX-r.left;
  oy=e.clientY-r.top;
  el.style.zIndex=100;
 });
 el.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const sr=stage.getBoundingClientRect(),er=el.getBoundingClientRect();
  let x=e.clientX-sr.left-ox,y=e.clientY-sr.top-oy;
  x=Math.max(0,Math.min(x,sr.width-er.width)); y=Math.max(0,Math.min(y,sr.height-er.height));
  el.style.left=x+"px"; el.style.top=y+"px";
 });
 el.addEventListener("pointerup",e=>{dragging=false;try{el.releasePointerCapture(e.pointerId)}catch(_){}});
}
document.getElementById("reset").onclick=()=>{
 document.querySelectorAll("#stage .word").forEach(e=>e.remove());
 words.innerHTML=""; labels.forEach(makeWord);
};
</script>
